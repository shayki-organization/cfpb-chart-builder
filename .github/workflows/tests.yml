name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  schedule:
    - cron: "0 0 * * *"
jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v2

    - name: Set up Node
      uses: actions/setup-node@v2
      with:
        node-version: 18

    - name: Install dependencies with Yarn
      run: ./setup.sh

    - name: Lint code
      run: gulp lint --ci

    - name: Run unit tests
      run: gulp test
